                      type="button"
                      onClick={() =>
                        setAutoPlayState((prev) => ({ ...prev, paused: !prev.paused }))
                      }
                      className="px-2.5 py-1 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold"
                    >
                      {autoPlayState.paused ? '계속 재생' : '일시정지'}
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={resetAll}
                    className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-bold"
                  >
                    ↺ 전체 초기화
                  </button>
                </div>
              </div>

              {mode === 'EXTERNAL_BRIDGE' && <div className="p-3 my-2 border border-amber-500 rounded text-amber-200">
                <p>외부 모드: 주문·배려 요청·고객 준비·정상 열기/닫기는 실제 APK에서 조작합니다.</p>
                <button type="button" disabled={!connectionState.connected}
                  className="mt-2 p-3 border rounded bg-slate-800 disabled:opacity-40"
                  onClick={() => sendEvaluatorInjection('평가자 초기 차량 상태 주입 · 고객 승인 아님', {
                    speedKph:0,gear:'P',uxRestricted:false,doors:{driverDoor:'CLOSED',passengerDoor:'CLOSED',trunk:'CLOSED'},
                    rearObstacle:false,vehicleDataValid:true,sensorDataValid:true,oemControlAllowed:true
                  })}>평가자: 정차·센서 정상 상태 주입 (실차 제어 아님)</button>
              </div>}
              {/* 제어 컨트롤 그리드 */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs">
                {/* 1) 주행·기어·UX 제한 */}
                <div className="p-2.5 rounded-lg bg-slate-950 border border-slate-800 space-y-2">
                  <div className="font-bold text-slate-300 border-b border-slate-800 pb-1">
                    차속 · 기어 · 주행 UX 제한
                  </div>
                  <div className="flex items-center justify-between gap-1">
                    <span>기어:</span>
                    <div className="flex gap-1">
                      {['P', 'D', 'R'].map((g) => (
                        <button
                          key={g}
                          type="button"
                          onClick={() =>
                            sendEvaluatorInjection(`기어 ${g}단 전환`, {
                              gear: g,
                              uxRestricted: g !== 'P' ? true : vehicleState.uxRestricted,
                            })
                          }
                          className={`px-2 py-0.5 rounded font-bold ${
                            vehicleState.gear === g
                              ? 'bg-sky-600 text-white'
                              : 'bg-slate-800 text-slate-400'
                          }`}
                        >
                          {g}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between text-[11px] text-slate-400 mb-0.5">
                      <span>차속 (km/h)</span>
                      <span className="font-mono text-sky-400">{vehicleState.speedKph} km/h</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="80"
                      step="5"
                      value={vehicleState.speedKph}
                      aria-label="차속 조절 슬라이더"
                      onChange={(e) => {
                        const spd = Number(e.target.value);
                        sendEvaluatorInjection(`차속 ${spd}km/h 변경`, {
                          speedKph: spd,
                          gear: spd > 0 && vehicleState.gear === 'P' ? 'D' : vehicleState.gear,
                          uxRestricted: spd > 0 ? true : vehicleState.uxRestricted,
                        });
                      }}
                      className="w-full accent-sky-500"
                    />
                  </div>

                  <button
                    type="button"
                    onClick={() =>
                      sendEvaluatorInjection(
                        `주행 UX 제한 ${!vehicleState.uxRestricted ? '활성화' : '해제'}`,
                        { uxRestricted: !vehicleState.uxRestricted }
                      )
                    }
                    className={`w-full py-1 rounded font-semibold border ${
                      vehicleState.uxRestricted
                        ? 'bg-amber-500/20 border-amber-500 text-amber-300'
                        : 'bg-slate-900 border-slate-700 text-slate-300'
                    }`}
                  >
                    UX 제한: {vehicleState.uxRestricted ? '활성 (잠금)' : '해제 (정상)'}
                  </button>
                </div>

                {/* 2) 센서·장애물·OEM·구역 */}
                <div className="p-2.5 rounded-lg bg-slate-950 border border-slate-800 space-y-1.5">
                  <div className="font-bold text-slate-300 border-b border-slate-800 pb-1">
                    센서 · 장애물 · 권한 · 구역
                  </div>
                  <button
                    type="button"
                    onClick={() =>
                      sendEvaluatorInjection(
                        `트렁크 후방 장애물 ${!vehicleState.rearObstacle ? '감지 주입' : '제거'}`,
                        { rearObstacle: !vehicleState.rearObstacle }
                      )
                    }
                    className={`w-full py-1 px-2 rounded font-semibold border text-left flex justify-between ${
                      vehicleState.rearObstacle
                        ? 'bg-rose-500/25 border-rose-500 text-rose-200'
                        : 'bg-slate-900 border-slate-700 text-slate-300'
                    }`}
                  >
                    <span>후방 장애물</span>
                    <span>{vehicleState.rearObstacle ? '감지됨' : '없음'}</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => {
                      const nextFreeze = !freezeSensorStream;
                      setFreezeSensorStream(nextFreeze);
                      if (mode === 'EXTERNAL_BRIDGE') {
                        sendEvaluatorInjection('센서 유효성 평가자 주입', {sensorDataValid: !nextFreeze});
                        return;
                      }
                      appendLog(
                        'EVAL_INJECT',
                        nextFreeze
                          ? '[평가자용 상태 주입] 센서 스트림 갱신 중단 (3초 후 센서 만료 발생)'
                          : '[평가자용 상태 주입] 센서 스트림 주기적 갱신 재개'
                      );
                    }}
                    className={`w-full py-1 px-2 rounded font-semibold border text-left flex justify-between ${
                      freezeSensorStream || !safetyEval.sensorFresh
                        ? 'bg-rose-500/25 border-rose-500 text-rose-200'
                        : 'bg-slate-900 border-slate-700 text-slate-300'
                    }`}
                  >
                    <span>센서 유효성(3s)</span>
                    <span>
                      {!safetyEval.sensorFresh
                        ? '만료됨'
                        : freezeSensorStream
                        ? '갱신중단(만료대기)'
                        : '유효'}
                    </span>
                  </button>

                  <button
                    type="button"
                    onClick={() =>
                      sendEvaluatorInjection(
                        `OEM 제어 권한 ${!vehicleState.oemControlAllowed ? '허용' : '거부'}`,
                        { oemControlAllowed: !vehicleState.oemControlAllowed }
                      )
                    }
                    className={`w-full py-1 px-2 rounded font-semibold border text-left flex justify-between ${
                      !vehicleState.oemControlAllowed
                        ? 'bg-rose-500/25 border-rose-500 text-rose-200'
                        : 'bg-slate-900 border-slate-700 text-slate-300'
                    }`}
                  >
                    <span>OEM 제어 권한</span>
                    <span>{vehicleState.oemControlAllowed ? '허용' : '거부'}</span>
                  </button>

                  <button
                    type="button"
                    disabled={mode === 'EXTERNAL_BRIDGE'}
                    title={mode === 'EXTERNAL_BRIDGE' ? '실제 APK에서 조작' : ''}
                    onClick={() =>
                      sendEvaluatorInjection(
                        `픽업 구역(A-3) ${!scenarioState.pickupZoneConfirmed ? '확인' : '미확인'}`,
                        null,
                        { pickupZoneConfirmed: !scenarioState.pickupZoneConfirmed }
                      )
                    }
                    className={`w-full py-1 px-2 rounded font-semibold border text-left flex justify-between ${
                      !scenarioState.pickupZoneConfirmed
                        ? 'bg-amber-500/25 border-amber-500 text-amber-200'
                        : 'bg-slate-900 border-slate-700 text-slate-300'
                    }`}
                  >
                    <span>픽업 구역(A-3)</span>
                    <span>{scenarioState.pickupZoneConfirmed ? '확인됨' : '미확인'}</span>
                  </button>
                </div>

                {/* 3) 매장·OTP·배려 픽업 응답 */}
                <div className="p-2.5 rounded-lg bg-slate-950 border border-slate-800 space-y-1.5">
                  <div className="font-bold text-slate-300 border-b border-slate-800 pb-1">
                    주문 · 직원 OTP · 매장 지원 응답
                  </div>
                  <button
                    type="button"
                    disabled={mode === 'EXTERNAL_BRIDGE'}
                    title={mode === 'EXTERNAL_BRIDGE' ? '실제 APK에서 조작' : ''}
                    onClick={() =>
                      sendEvaluatorInjection(
                        `주문 준비 상태 ${!scenarioState.orderReady ? '완료' : '미완료'}`,
                        null,
                        { orderReady: !scenarioState.orderReady }
                      )
                    }
                    className={`w-full py-1 px-2 rounded font-semibold border text-left flex justify-between ${
                      !scenarioState.orderReady
                        ? 'bg-amber-500/25 border-amber-500 text-amber-200'
                        : 'bg-slate-900 border-slate-700 text-slate-300'
                    }`}
                  >
                    <span>매장 주문 준비</span>
                    <span>{scenarioState.orderReady ? 'READY' : '미완료'}</span>
                  </button>

                  <button
                    type="button"
                    disabled={mode === 'EXTERNAL_BRIDGE'}
                    title={mode === 'EXTERNAL_BRIDGE' ? '실제 APK에서 조작' : ''}
                    onClick={() =>
                      sendEvaluatorInjection(
                        `직원 OTP 인증 ${!scenarioState.otpVerified ? '성공' : '실패(미인증)'}`,
                        null,
                        { otpVerified: !scenarioState.otpVerified }
                      )
                    }
                    className={`w-full py-1 px-2 rounded font-semibold border text-left flex justify-between ${
                      !scenarioState.otpVerified
                        ? 'bg-rose-500/25 border-rose-500 text-rose-200'
                        : 'bg-slate-900 border-slate-700 text-slate-300'
                    }`}
                  >
                    <span>직원 OTP 인증</span>
                    <span>{scenarioState.otpVerified ? '인증됨' : '미인증'}</span>
                  </button>

                  <div className="pt-1">
                    <span className="block text-[11px] text-slate-400 mb-1">
                      매장 배려 지원 응답:
                    </span>
                    <div className="grid grid-cols-3 gap-1">
                      {[
                        { code: 'PENDING', label: '대기' },
                        { code: 'ACCEPTED', label: '수락' },
                        { code: 'DECLINED', label: '거절' },
                      ].map((r) => (
                        <button
                          key={r.code}
                          type="button"
                          disabled={mode === 'EXTERNAL_BRIDGE'}
                          title={mode === 'EXTERNAL_BRIDGE' ? '실제 APK에서 조작' : ''}
                          onClick={() =>
                            sendEvaluatorInjection(`매장 지원 응답: ${r.label}`, null, {
                              merchantResponse: r.code,
                            })
                          }
                          className={`py-1 rounded font-bold border ${
                            scenarioState.merchantResponse === r.code
                              ? 'bg-indigo-600 border-indigo-400 text-white'
                              : 'bg-slate-900 border-slate-700 text-slate-400'
                          }`}
                        >
                          {r.label}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                {/* 4) 도어 강제 상태 주입 & 통신 연결 제어 */}
                <div className="p-2.5 rounded-lg bg-slate-950 border border-slate-800 space-y-1.5">
                  <div className="font-bold text-slate-300 border-b border-slate-800 pb-1">
                    평가자용 상태 주입 · 통신 제어
                  </div>
                  {[
                    { key: 'driverDoor', label: '운전석 도어 주입' },
                    { key: 'passengerDoor', label: '조수석 도어 주입' },
                    { key: 'trunk', label: '트렁크 상태 주입' },
                  ].map((d) => {
                    const isOpen = vehicleState.doors[d.key] === 'OPEN';
                    return (
                      <button
                        key={d.key}
                        type="button"
                        onClick={() =>
                          sendEvaluatorInjection(
                            `${d.label}: ${isOpen ? 'CLOSED' : 'OPEN'}`,
                            {
                              doors: { [d.key]: isOpen ? 'CLOSED' : 'OPEN' },
                            }
                          )
                        }
                        className="w-full py-1 px-2 rounded bg-slate-900 hover:bg-slate-800 border border-slate-700 text-left flex justify-between"
                      >
                        <span>{d.label}</span>
                        <span className="font-mono text-sky-400">
                          {vehicleState.doors[d.key]}
                        </span>
                      </button>
                    );
                  })}

                  <button
                    type="button"
                    onClick={() => {
                      if (mode === 'EXTERNAL_BRIDGE') {
                        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) wsRef.current.close();
                        else connectWebSocket();
                        return;
                      }
                      const nextConn = !connectionState.connected;
                      if (!nextConn) {
                        setConnectionState((prev) => ({
                          ...prev,
                          connected: false,
                          snapshotReceived: false,
                        }));
                        setVehicleState((prev) => ({
                          ...prev,
                          gear: 'UNKNOWN',
                          doors: {
                            driverDoor: 'UNKNOWN',
                            passengerDoor: 'UNKNOWN',
                            trunk: 'UNKNOWN',
                          },
                        }));
                        appendLog('COMM_DROP', '[평가자 주입] 통신 연결 해제 — 상태 UNKNOWN 및 제어 차단');
                      } else {
                        const now = Date.now();
                        setConnectionState({
                          connected: true,
                          snapshotReceived: true,
                          sessionId: createId('sess-re'),
                          lastHeartbeatAt: now,
                          lastSequence: 1,
                        });
                        setVehicleState((prev) => ({
                          ...prev,
                          sequence: 1,
                          gear: 'P',
                          speedKph: 0,
                          doors: {
                            driverDoor: 'CLOSED',
                            passengerDoor: 'CLOSED',
                            trunk: 'CLOSED',
                          },
                          lastVehicleRxAt: now,
                          lastSensorRxAt: now,
                        }));
                        appendLog('COMM_RESTORE', '[평가자 주입] 통신 재연결 및 새 세션 스냅샷 동기화 완료');
                      }
                    }}
                    className={`w-full py-1 px-2 rounded font-bold border text-left flex justify-between ${
                      !connectionState.connected
                        ? 'bg-rose-600/30 border-rose-400 text-rose-200'
                        : 'bg-emerald-600/20 border-emerald-500/60 text-emerald-300'
                    }`}
                  >
                    <span>통신 상태</span>
                    <span>{connectionState.connected ? 'CONNECTED' : 'DISCONNECTED'}</span>
                  </button>
                </div>
              </div>
            </section>

            {/* 우측 이벤트 로그 패널 (4칸) */}
            <section
              aria-label="프로토콜 및 안전 판단 이벤트 로그"
              className="lg:col-span-4 p-3 rounded-xl bg-slate-900/95 border border-slate-800 flex flex-col justify-between max-h-[230px]"
            >
              <div className="flex items-center justify-between pb-1.5 mb-1.5 border-b border-slate-800">
                <span className="text-xs font-bold text-slate-200">
                  실시간 이벤트 · 안전 인터록 로그 (최대 {MAX_LOG_COUNT}건)
                </span>
                <div className="flex items-center gap-1.5">
                  <button
                    type="button"
                    onClick={() => {
                      const dupReqId = `req-dup-${Date.now().toString(36)}`;
                      handleDoorCommandRequest('trunk', 'OPEN', '중복 명령 1차 전송', dupReqId);
                      handleDoorCommandRequest('trunk', 'OPEN', '중복 명령 2차 재수신 테스트', dupReqId);
                    }}
                    className="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-sky-300 border border-slate-700"
                  >
                    중복 명령 방어 시험
                  </button>
                  <button
                    type="button"
                    onClick={() => setEventLogs([])}
                    className="px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-slate-400"
                  >
                    비우기
                  </button>
                </div>
              </div>

              <div className="flex-1 overflow-y-auto custom-scroll space-y-1 pr-1 font-mono text-[11px]">
                {eventLogs.length === 0 ? (
                  <div className="text-slate-500 py-6 text-center">기록된 이벤트가 없습니다.</div>
                ) : (
                  eventLogs.map((item) => (
                    <div
                      key={item.id}
                      className="px-2 py-1 rounded bg-slate-950 border border-slate-800/80 text-slate-300 flex items-start gap-1.5"
                    >
                      <span className="text-slate-500 shrink-0">{item.time}</span>
                      <span className="px-1 rounded bg-slate-800 text-sky-400 shrink-0 text-[10px]">
                        {item.category}
                      </span>
                      <span className="break-all">{item.summary}</span>
                    </div>
                  ))
                )}
              </div>
            </section>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
