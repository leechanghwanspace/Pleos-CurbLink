    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ============================================================================
    // 1. 상수 및 프로토콜 규격 (curblink.vehicle.v1)
    // ============================================================================
    const PROTOCOL_VERSION = 'curblink.vehicle.v1';
    const DEFAULT_WS_URL = 'ws://127.0.0.1:8765';
    const DEFAULT_VEHICLE_TTL_MS = 1000;
    const DEFAULT_SENSOR_TTL_MS = 3000;
    const COMMAND_TIMEOUT_MS = 4000;
    const MAX_LOG_COUNT = 60;
    const MAX_SEEN_IDS = 200;

    const REASON_LABELS_KO = {
      BRIDGE_DISCONNECTED: '통신 연결 끊김 (제어 차단)',
      STATE_SNAPSHOT_UNKNOWN: '차량 상태 스냅샷 미수신 (UNKNOWN)',
      SPEED_NON_ZERO: '차량 속도 0km/h 아님 (주행 중)',
      GEAR_NOT_P: '변속 기어가 P단이 아님',
      UX_RESTRICTED: '주행 중 UX 제한 활성화됨',
      VEHICLE_DATA_STALE_OR_INVALID: '차량 상태 데이터 만료(1초 초과) 또는 무효',
      SENSOR_DATA_EXPIRED: '주변 센서 데이터 만료(3초 초과) 또는 무효',
      REAR_OBSTACLE_DETECTED: '트렁크 후방 장애물 감지됨',
      STAFF_OTP_UNVERIFIED: '직원 OTP 인증 미완료',
      OEM_CONTROL_DENIED: 'OEM 제어 권한 거부됨',
      ORDER_NOT_READY: '매장 주문 준비 미완료',
      PICKUP_ZONE_UNCONFIRMED: '지정 픽업 구역(A-3) 미확인',
      TRUNK_NOT_CLOSED: '트렁크가 닫힘(CLOSED) 상태가 아님',
      USER_EXPLICIT_APPROVAL_REQUIRED: '사용자의 명시적 열기 요청 없음',
      CARE_MERCHANT_NOT_ACCEPTED: '배려 픽업: 매장 지원 수락 대기 또는 거절됨',
      CARE_CUSTOMER_NOT_READY: '배려 픽업: 정차 중 고객 "준비됐어요" 미확인',
    };

    function createId(prefix = 'msg') {
      return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    }

    function isCareRequested(carePrefs) {
      if (!carePrefs) return false;
      return Boolean(carePrefs.waitInVehicle || carePrefs.loadingHelp || carePrefs.extraPrepTime);
    }

    // ============================================================================
    // 2. 단일 안전 판단 함수 (트렁크 열기 허용 13개 조건 검증)
    // ============================================================================
    function evaluateTrunkSafety({
      vehicleState,
      scenarioState,
      connectionState,
      nowMs,
      explicitUserRequest = false,
      ttlConfig = { vehicleTtlMs: DEFAULT_VEHICLE_TTL_MS, sensorTtlMs: DEFAULT_SENSOR_TTL_MS },
    }) {
      const checks = [];
      const addCheck = (id, label, passed, failCode) => {
        checks.push({ id, label, passed: Boolean(passed), code: passed ? null : failCode });
      };

      const isConnected = Boolean(connectionState && connectionState.connected);
      const hasSnapshot = Boolean(connectionState && connectionState.snapshotReceived);

      const vehicleFresh =
        isConnected &&
        hasSnapshot &&
        Boolean(vehicleState.vehicleDataValid) &&
        vehicleState.lastVehicleRxAt > 0 &&
        nowMs - vehicleState.lastVehicleRxAt <= ttlConfig.vehicleTtlMs;

      const sensorFresh =
        isConnected &&
        hasSnapshot &&
        Boolean(vehicleState.sensorDataValid) &&
        vehicleState.lastSensorRxAt > 0 &&
        nowMs - vehicleState.lastSensorRxAt <= ttlConfig.sensorTtlMs;

      addCheck('conn', '통신 연결 및 상태 스냅샷 확인', isConnected && hasSnapshot, !isConnected ? 'BRIDGE_DISCONNECTED' : 'STATE_SNAPSHOT_UNKNOWN');
      addCheck('c1', '1. 차량 속도 0 km/h', isConnected && hasSnapshot && vehicleState.speedKph === 0, 'SPEED_NON_ZERO');
      addCheck('c2', '2. 기어 P단', isConnected && hasSnapshot && vehicleState.gear === 'P', 'GEAR_NOT_P');
      addCheck('c3', '3. 주행 UX 제한 없음', isConnected && hasSnapshot && vehicleState.uxRestricted === false, 'UX_RESTRICTED');
      addCheck('c4', '4. 차량 상태 데이터 유효 (1초 이내)', vehicleFresh, 'VEHICLE_DATA_STALE_OR_INVALID');
      addCheck('c5', '5. 주변 센서 데이터 유효 (3초 이내)', sensorFresh, 'SENSOR_DATA_EXPIRED');
      addCheck('c6', '6. 트렁크 후방 장애물 없음', isConnected && hasSnapshot && vehicleState.rearObstacle === false, 'REAR_OBSTACLE_DETECTED');
      addCheck('c7', '7. 직원 OTP 인증 완료', isConnected && hasSnapshot && scenarioState.otpVerified === true, 'STAFF_OTP_UNVERIFIED');
      addCheck('c8', '8. OEM 제어 권한 허용', isConnected && hasSnapshot && vehicleState.oemControlAllowed === true, 'OEM_CONTROL_DENIED');
      addCheck('c9', '9. 주문 준비 완료', isConnected && hasSnapshot && scenarioState.orderReady === true, 'ORDER_NOT_READY');
      addCheck('c10', '10. 픽업 구역(A-3) 확인 완료', isConnected && hasSnapshot && scenarioState.pickupZoneConfirmed === true, 'PICKUP_ZONE_UNCONFIRMED');
      addCheck('c11', '11. 트렁크 닫힘(CLOSED) 확인', isConnected && hasSnapshot && vehicleState.doors?.trunk === 'CLOSED', 'TRUNK_NOT_CLOSED');
      addCheck('c12', '12. 사용자 명시적 열기 요청', Boolean(explicitUserRequest), 'USER_EXPLICIT_APPROVAL_REQUIRED');

      const careNeeded = isCareRequested(scenarioState.carePrefs);
      if (careNeeded) {
        addCheck(
          'c13a',
          '13-A. 배려 픽업: 매장 지원 수락 완료',
          isConnected && hasSnapshot && scenarioState.merchantResponse === 'ACCEPTED',
          'CARE_MERCHANT_NOT_ACCEPTED'
        );
        addCheck(
          'c13b',
          '13-B. 배려 픽업: 고객 명시적 준비 확인',
          isConnected && hasSnapshot && scenarioState.customerReadyConfirmed === true,
          'CARE_CUSTOMER_NOT_READY'
        );
      } else {
        addCheck('c13', '13. 일반 픽업 모드 (추가 배려 조건 불필요)', true, null);
      }

      const reasonCodes = checks.filter((c) => !c.passed && c.code).map((c) => c.code);
      // 버튼 활성화 가능 여부 (12번 사용자 클릭 직전 1~11, 13번 사전조건 충족 여부)
      const preConditionsCodes = reasonCodes.filter((code) => code !== 'USER_EXPLICIT_APPROVAL_REQUIRED');

      return {
        allowed: reasonCodes.length === 0,
        canEnableOpenButton: preConditionsCodes.length === 0,
        reasonCodes,
        preConditionsCodes,
        reasonsKo: reasonCodes.map((c) => REASON_LABELS_KO[c] || c),
        preConditionsKo: preConditionsCodes.map((c) => REASON_LABELS_KO[c] || c),
        checks,
        vehicleFresh,
        sensorFresh,
      };
    }

    // ============================================================================
    // 3. 메시지 검증기 (Schema & Enum Validation)
    // ============================================================================
    function validateProtocolMessage(raw) {
      if (!raw || typeof raw !== 'object') return { valid: false, error: 'Not an object' };
      if (raw.protocol !== PROTOCOL_VERSION) return { valid: false, error: 'Unsupported protocol' };
      if (typeof raw.messageId !== 'string' || !raw.messageId.trim()) return { valid: false, error: 'Invalid messageId' };
      if (!['ivi-app', 'simulator', 'android-bridge'].includes(raw.source)) return { valid: false, error: 'Invalid source' };
      if (typeof raw.sessionId !== 'string' || !raw.sessionId.trim()) return { valid: false, error: 'Invalid sessionId' };
      if (!['HELLO', 'HEARTBEAT', 'COMMAND_REQUEST', 'COMMAND_RESULT', 'VEHICLE_STATE', 'SCENARIO_STATE', 'EVALUATOR_INJECT', 'ERROR'].includes(raw.type)) {
        return { valid: false, error: 'Invalid message type' };
      }
      if (typeof raw.timestamp !== 'number' || !Number.isFinite(raw.timestamp)) return { valid: false, error: 'Invalid timestamp' };
      if (!raw.payload || typeof raw.payload !== 'object') return { valid: false, error: 'Missing payload' };

      const p = raw.payload;
      if (raw.type === 'COMMAND_REQUEST') {
        if (typeof p.requestId !== 'string' || !p.requestId) return { valid: false, error: 'Missing requestId' };
        if (!['driverDoor', 'passengerDoor', 'trunk'].includes(p.target)) return { valid: false, error: 'Invalid target' };
        if (!['OPEN', 'CLOSE'].includes(p.action)) return { valid: false, error: 'Invalid action' };
      } else if (raw.type === 'COMMAND_RESULT') {
        if (typeof p.requestId !== 'string' || !p.requestId) return { valid: false, error: 'Missing requestId' };
        if (typeof p.accepted !== 'boolean') return { valid: false, error: 'Invalid accepted boolean' };
        if (!Array.isArray(p.reasonCodes)) return { valid: false, error: 'Invalid reasonCodes array' };
      } else if (raw.type === 'VEHICLE_STATE') {
        if (!Number.isSafeInteger(p.sequence) || p.sequence < 0) return { valid: false, error: 'Invalid sequence' };
        if (typeof p.speedKph !== 'number' || !Number.isFinite(p.speedKph) || p.speedKph < 0 || p.speedKph > 200) return { valid: false, error: 'Invalid speedKph' };
        if (!['P', 'D', 'R', 'UNKNOWN'].includes(p.gear)) return { valid: false, error: 'Invalid gear' };
        if (['uxRestricted', 'rearObstacle', 'vehicleDataValid', 'sensorDataValid', 'oemControlAllowed'].some(k => typeof p[k] !== 'boolean')) return { valid: false, error: 'Invalid uxRestricted' };
        if (!p.doors || typeof p.doors !== 'object') return { valid: false, error: 'Missing doors' };
        for (const k of ['driverDoor', 'passengerDoor', 'trunk']) {
          if (!['OPEN', 'CLOSED', 'UNKNOWN'].includes(p.doors[k])) return { valid: false, error: `Invalid door state: ${k}` };
        }
      }
      return { valid: true };
    }

    // ============================================================================
    // 4. 발표용 6단계 자동 시나리오 정의 (약 72초)
    // ============================================================================
    const PRESENTATION_STEPS = [
      {
        step: 1,
        title: '1단계: 퇴근길 주행 (30km/h · D단)',
        durationMs: 11000,
        camera: 'IVI_FOCUS',
        narration: '주행 중(30km/h, D단)에는 운전자 주의 분산 방지를 위해 앱의 터치 조작이 잠깁니다. 사전 작성된 Gleo 음성 시연으로 주문을 확인합니다.',
        voiceDialog: [
          { speaker: '운전자', text: '"헤이 글레오, 마트 픽업 주문 상태 알려줘."' },
          { speaker: 'Gleo 시연', text: '"지정 픽업 구역 A-3로 안내 중입니다. 차량 내 대기 및 적재 도움 옵션을 요청할까요?"' },
        ],
        simulatedUserInput: false,
        apply: (ctx) => {
          ctx.setVehicle({
            speedKph: 30,
            gear: 'D',
            uxRestricted: true,
            doors: { driverDoor: 'CLOSED', passengerDoor: 'CLOSED', trunk: 'CLOSED' },
            rearObstacle: false,
            vehicleDataValid: true,
            sensorDataValid: true,
            oemControlAllowed: true,
          });
          ctx.setScenario({
            orderReady: false,
            pickupZoneConfirmed: false,
            otpVerified: false,
            carePrefs: { waitInVehicle: false, loadingHelp: false, extraPrepTime: false },
            merchantResponse: 'PENDING',
            customerReadyConfirmed: false,
            handoffCompleted: false,
          });
        },
      },
      {
        step: 2,
        title: '2단계: 배려 픽업 접수 및 매장 수락',
        durationMs: 11000,
        camera: 'IVI_FOCUS',
        narration: '차량 내 대기 및 물품 적재 도움이 접수되고, 매장에서 지원 요청을 수락(ACCEPTED)합니다. 진단명이나 장애 여부는 수집하지 않습니다.',
        voiceDialog: [
          { speaker: '운전자', text: '"응, 차량 안에서 대기하고 적재 도움 요청해줘."' },
          { speaker: 'Gleo 시연', text: '"배려 픽업 요청이 접수되었으며 매장에서 지원을 수락했습니다."' },
        ],
        simulatedUserInput: true,
        apply: (ctx) => {
          ctx.setScenario((prev) => ({
            ...prev,
            orderReady: true,
            carePrefs: { waitInVehicle: true, loadingHelp: true, extraPrepTime: false },
            merchantResponse: 'ACCEPTED',
            customerReadyConfirmed: false,
          }));
        },
      },
      {
        step: 3,
        title: '3단계: 픽업 구역(A-3) 도착 및 정차',
        durationMs: 12000,
        camera: 'EXTERIOR',
        narration: '픽업 구역 A-3에 도착하여 차속 0km/h, P단으로 정차하고 직원 OTP 인증을 마쳤습니다. 단, 도착만으로 고객 준비 상태가 자동 완료되지는 않습니다.',
        voiceDialog: [],
        simulatedUserInput: false,
        apply: (ctx) => {
          ctx.setVehicle((prev) => ({
            ...prev,
            speedKph: 0,
            gear: 'P',
            uxRestricted: false,
            rearObstacle: false,
          }));
          ctx.setScenario((prev) => ({
            ...prev,
            orderReady: true,
            pickupZoneConfirmed: true,
            otpVerified: true,
            customerReadyConfirmed: false,
          }));
        },
      },
      {
        step: 4,
        title: '4단계: 후방 장애물 감지 및 안전 차단',
        durationMs: 13000,
        camera: 'TRUNK_HANDOFF',
        narration: '트렁크 후방에 장애물이 감지된 상태에서 열기를 요청하면 안전 인터록이 즉시 동작을 차단하고 사유를 표시합니다.',
        voiceDialog: [],
        simulatedUserInput: true,
        apply: (ctx) => {
          ctx.setVehicle((prev) => ({
            ...prev,
            rearObstacle: true,
          }));
          setTimeout(() => {
            ctx.triggerOpenTrunkRequest('시연 스크립트 자동 열기 시도 (차단 검증)');
          }, 2200);
        },
      },
      {
        step: 5,
        title: '5단계: 장애물 제거 · 고객 준비 확인 · 조건 재검사',
        durationMs: 12000,
        camera: 'IVI_FOCUS',
        narration: '후방 장애물이 제거되고 센서가 갱신된 후, 정차 중인 고객이 직접 "준비됐어요"를 확인합니다. 이제 트렁크 열기 사전 조건 12개가 모두 충족됩니다.',
        voiceDialog: [],
        simulatedUserInput: true,
        apply: (ctx) => {
          ctx.setVehicle((prev) => ({
            ...prev,
            rearObstacle: false,
            sensorDataValid: true,
          }));
          ctx.setScenario((prev) => ({
            ...prev,
            customerReadyConfirmed: true,
          }));
        },
      },
      {
        step: 6,
        title: '6단계: 트렁크 개방 승인 및 물품 인계 완료',
        durationMs: 14000,
        camera: 'TRUNK_HANDOFF',
        narration: '고객의 명시적 열기 요청 시점에 13개 전 조건을 재검사하여 승인합니다. 트렁크가 열리고 직원 적재 완료 후 닫히며 인계가 마무리됩니다.',
        voiceDialog: [],
        simulatedUserInput: true,
        apply: (ctx) => {
          setTimeout(() => {
            ctx.triggerOpenTrunkRequest('시연 스크립트 사용자 열기 승인 재생');
          }, 1500);
          setTimeout(() => {
            ctx.completeLoadingAndCloseTrunk();
          }, 8500);
        },
      },
    ];

    // ============================================================================
    // 5. Three.js 3D 차량 뷰 컴포넌트 (WebGL 불가 시 2D 폴백 지원)
    // ============================================================================
    function App() {
      const [presentationMode, setPresentationMode] = useState(true);
      const [destinationActive, setDestinationActive] = useState(false);
      const [navigationFrame, setNavigationFrame] = useState(null);
      // 실행 모드: 'WEB_DEMO' (독립 웹 데모) | 'EXTERNAL_BRIDGE' (외부 브리지 연결)
      const [mode, setMode] = useState('WEB_DEMO');
      const [cameraMode, setCameraMode] = useState('EXTERIOR');
      const [reducedMotion, setReducedMotion] = useState(() =>
        window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false
      );

      // IVI 표시 모드: 'BUILTIN' (자체 포함 CurbLink 웹 화면) | 'IFRAME' (외부 웹 URL) | 'APK_MIRROR_INFO' (외부 AAOS 에뮬레이터 연결 안내)
      const [iviDisplayType, setIviDisplayType] = useState('BUILTIN');
      const [iframeUrlInput, setIframeUrlInput] = useState('');
      const [activeIframeUrl, setActiveIframeUrl] = useState('');
      const [allowedOriginInput, setAllowedOriginInput] = useState(window.location.origin || 'http://localhost:8000');
      const [urlError, setUrlError] = useState('');

      // WebSocket 설정
      const [wsUrlInput, setWsUrlInput] = useState(DEFAULT_WS_URL);
      const [wsStatusText, setWsStatusText] = useState('연결되지 않음 (WebSocket 미연결)');

      // TTL 설정 (1초 / 3초 기본 분리)
      const [ttlConfig, setTtlConfig] = useState({
        vehicleTtlMs: DEFAULT_VEHICLE_TTL_MS,
        sensorTtlMs: DEFAULT_SENSOR_TTL_MS,
      });

      // 센서 만료 시뮬레이션 스위치 (켜면 센서 갱신 중단하여 3초 뒤 실제 만료 발생)
      const [freezeSensorStream, setFreezeSensorStream] = useState(false);

      // 현재 시각 (데이터 신선도 실시간 계산용)
      const [nowMs, setNowMs] = useState(() => Date.now());

      // 연결 상태
      const [connectionState, setConnectionState] = useState({
        connected: true,
        snapshotReceived: true,
        sessionId: createId('sess'),
        lastHeartbeatAt: Date.now(),
        lastSequence: 0,
      });

      // 차량 물리/센서 상태
      const [vehicleState, setVehicleState] = useState(() => {
        const t = Date.now();
        return {
          sequence: 1,
          speedKph: 0,
          gear: 'P',
          uxRestricted: false,
          doors: {
            driverDoor: 'CLOSED',
            passengerDoor: 'CLOSED',
            trunk: 'CLOSED',
          },
          rearObstacle: false,
          vehicleDataValid: true,
          sensorDataValid: true,
          oemControlAllowed: true,
          lastVehicleRxAt: t,
          lastSensorRxAt: t,
        };
      });

      // 시나리오/주문/배려 픽업 상태
      const [scenarioState, setScenarioState] = useState({
        orderId: 'ORD-2026-A3',
        orderItemsSummary: '친환경 우유 외 4건 (28,500원)',
        orderReady: true,
        pickupZoneConfirmed: true,
        otpVerified: true,
        carePrefs: {
          waitInVehicle: false,
          loadingHelp: false,
          extraPrepTime: false,
        },
        merchantResponse: 'PENDING', // 'PENDING' | 'ACCEPTED' | 'DECLINED'
        customerReadyConfirmed: false,
        invalidationNotice: '',
        handoffCompleted: false,
      });

      // 명령 처리 및 마지막 차단/승인 결과
      const [commandStatus, setCommandStatus] = useState({
        pendingRequestId: null,
        lastVerdict: null, // 'APPROVED' | 'BLOCKED' | 'UNCONFIRMED_TIMEOUT' | 'WAITING_EXTERNAL'
        lastMessage: '대기 중 — 안전 조건을 확인하고 트렁크 열기를 요청하세요.',
        reasonCodes: [],
      });

      // 발표용 자동 시나리오 재생 상태
      const [autoPlayState, setAutoPlayState] = useState({
        playing: false,
        paused: false,
        currentStep: 0,
        simulatedInputBanner: false,
        voiceDialog: [],
        narration: '',
      });

      // 접근성 알림(aria-live) 및 이벤트 로그 (최대 60개)
      const [ariaAnnouncement, setAriaAnnouncement] = useState('');
      const [eventLogs, setEventLogs] = useState([]);

      // Refs
      const iframeRef = useRef(null);
      const bcRef = useRef(null);
      const wsRef = useRef(null);
      const seenMessageIdsRef = useRef(new Set());
      const processedRequestIdsRef = useRef(new Set());
      const receivedStateRef = useRef({sessionId:null, sequence:-1});
      const commandTimeoutRef = useRef(null);
      const stateRef = useRef({
        mode,
        vehicleState,
        scenarioState,
        connectionState,
        ttlConfig,
        freezeSensorStream,
        allowedOriginInput,
      });

      useEffect(() => {
        stateRef.current = {
          mode,
          vehicleState,
          scenarioState,
          connectionState,
          ttlConfig,
          freezeSensorStream,
          allowedOriginInput,
        };
      }, [mode, vehicleState, scenarioState, connectionState, ttlConfig, freezeSensorStream, allowedOriginInput]);

      // 안전 로그 추가 헬퍼 (최근 MAX_LOG_COUNT개만 유지)
      const appendLog = useCallback((category, summary, detailObj = null) => {
        const entry = {
          id: createId('log'),
          time: new Date().toLocaleTimeString('ko-KR', { hour12: false }),
          category,
          summary: String(summary),
          detail: detailObj ? JSON.stringify(detailObj) : '',
        };
        setEventLogs((prev) => [entry, ...prev.slice(0, MAX_LOG_COUNT - 1)]);
      }, []);

      const announce = useCallback((msg) => {
        setAriaAnnouncement(String(msg));
      }, []);

      // 중복 messageId 방지 (크기 제한)
      const checkAndRecordMessageId = useCallback((messageId) => {
        const set = seenMessageIdsRef.current;
        if (set.has(messageId)) return false;
        set.add(messageId);
        if (set.size > MAX_SEEN_IDS) {
          const first = set.values().next().value;
          set.delete(first);
        }
        return true;
      }, []);

      // ============================================================================
      // 7. 배려 픽업 준비 확인 자동 무효화 감시
      // ============================================================================
      useEffect(() => {
        if (mode === 'EXTERNAL_BRIDGE' || !scenarioState.customerReadyConfirmed) return;

        let invalidateReason = '';
        if (vehicleState.gear !== 'P') {
          invalidateReason = 'P단 이탈로 인해 고객 준비 확인이 무효화되었습니다.';
        } else if (vehicleState.uxRestricted) {
          invalidateReason = '주행 중 UX 제한 활성화로 인해 고객 준비 확인이 무효화되었습니다.';
        } else if (vehicleState.speedKph > 0) {
          invalidateReason = '차량 이동(속도 발생)으로 인해 고객 준비 확인이 무효화되었습니다.';
        } else if (scenarioState.merchantResponse === 'DECLINED') {
          invalidateReason = '매장 지원 거절로 인해 고객 준비 확인이 무효화되었습니다.';
        }

        if (invalidateReason) {
          setScenarioState((prev) => ({
            ...prev,
            customerReadyConfirmed: false,
            invalidationNotice: invalidateReason,
          }));
          appendLog('SAFETY_INVALIDATE', invalidateReason);
          announce(invalidateReason);
        }
      }, [
        vehicleState.gear,
        vehicleState.uxRestricted,
        vehicleState.speedKph,
        scenarioState.merchantResponse,
        scenarioState.customerReadyConfirmed,
        appendLog,
        announce,
      ]);

      // ============================================================================
      // 8. 주기적 타이머 (150ms UI 시계 & WEB_DEMO 모드 하트비트/신선도 갱신)
      // ============================================================================
      useEffect(() => {
        const timer = setInterval(() => {
          const now = Date.now();
          setNowMs(now);

          const {
            mode: currentMode,
            connectionState: cs,
            freezeSensorStream: freezeSensor,
          } = stateRef.current;

          // 독립 웹 데모 모드이고 연결 중일 때 주기적으로 데이터 신선도 타임스탬프 갱신
          if (currentMode === 'WEB_DEMO' && cs.connected && cs.snapshotReceived) {
            setVehicleState((prev) => ({
              ...prev,
              lastVehicleRxAt: prev.vehicleDataValid ? now : prev.lastVehicleRxAt,
              lastSensorRxAt: !freezeSensor && prev.sensorDataValid ? now : prev.lastSensorRxAt,
            }));
          }
        }, 200);

        return () => clearInterval(timer);
      }, []);

      // ============================================================================
      // 9. 단축키 지원 (입력 필드 포커스 시 비활성화)
      // ============================================================================
      useEffect(() => {
        const handleKeyDown = (e) => {
          const tag = (e.target && e.target.tagName) || '';
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target?.isContentEditable) {
            return;
          }
          if (presentationMode || destinationActive) return;
          if (e.key === '1') setCameraMode('EXTERIOR');
          else if (e.key === '2') setCameraMode('IVI_FOCUS');
          else if (e.key === '3') setCameraMode('TRUNK_HANDOFF');
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [presentationMode, destinationActive]);

      // ============================================================================
      // 10. 외부 통신 전송 어댑터 (postMessage / BroadcastChannel / WebSocket)
      // ============================================================================
      const sendProtocolEnvelope = useCallback(
        (type, payload, targetChannel = 'all') => {
          const { connectionState: cs, allowedOriginInput: allowedOrigin } = stateRef.current;
          const envelope = {
            protocol: PROTOCOL_VERSION,
            messageId: createId('msg'),
            source: 'simulator',
            sessionId: cs.sessionId,
            type,
            timestamp: Date.now(),
            payload,
          };

          checkAndRecordMessageId(envelope.messageId);

          // 1) iframe postMessage (허용된 출처만 사용, '*' 기본 사용 금지)
          if (
            (targetChannel === 'all' || targetChannel === 'iframe') &&
            iframeRef.current &&
            iframeRef.current.contentWindow &&
            allowedOrigin &&
            allowedOrigin !== '*'
          ) {
            try {
              iframeRef.current.contentWindow.postMessage(envelope, allowedOrigin);
            } catch (err) {
              appendLog('TRANSPORT_WARN', `postMessage 전송 실패 (${err.message})`);
            }
          }

          // 2) BroadcastChannel('vehicle-bridge')
          if ((targetChannel === 'all' || targetChannel === 'bc') && bcRef.current) {
            try {
              bcRef.current.postMessage(envelope);
            } catch (err) {
              appendLog('TRANSPORT_WARN', `BroadcastChannel 전송 실패`);
            }
          }

          // 3) WebSocket
          if (
            (targetChannel === 'all' || targetChannel === 'ws') &&
            wsRef.current &&
            wsRef.current.readyState === WebSocket.OPEN
          ) {
            wsRef.current.send(JSON.stringify(envelope));
          }

          return envelope;
        },
        [appendLog, checkAndRecordMessageId]
      );

      // ============================================================================
      // 11. 수신 메시지 처리 함수 (handleIncomingProtocolMessage)
      // ============================================================================
      useEffect(() => {
        if (mode !== 'EXTERNAL_BRIDGE') return;
        const timer = setInterval(() => {
          if (stateRef.current.connectionState.snapshotReceived) sendProtocolEnvelope('HEARTBEAT', {alive:true}, 'ws');
        }, 1000);
        return () => clearInterval(timer);
      }, [mode, sendProtocolEnvelope]);

      const applyIncomingVehicleState = useCallback(
        (payload, sessionId) => {
          const now = Date.now();
          const received = receivedStateRef.current;
          if (received.sessionId === sessionId && payload.sequence <= received.sequence) return;
          receivedStateRef.current = {sessionId, sequence:payload.sequence};
          setConnectionState(prev => ({...prev, connected:true, snapshotReceived:true,
            sessionId, lastSequence:payload.sequence, lastHeartbeatAt:now}));
          setVehicleState((prev) => {
            return {
              ...prev,
              sequence: payload.sequence,
              speedKph: payload.speedKph,
              gear: payload.gear,
              uxRestricted: payload.uxRestricted,
              doors: { ...payload.doors },
              rearObstacle: Boolean(payload.rearObstacle),
              vehicleDataValid: Boolean(payload.vehicleDataValid),
              sensorDataValid: Boolean(payload.sensorDataValid),
              oemControlAllowed: Boolean(payload.oemControlAllowed),
              lastVehicleRxAt: Boolean(payload.vehicleDataValid) ? now : prev.lastVehicleRxAt,
              lastSensorRxAt: Boolean(payload.sensorDataValid) ? now : prev.lastSensorRxAt,
            };
          });
        },
        [appendLog]
      );

      const applyIncomingCommandResult = useCallback(
        (payload) => {
          if (commandTimeoutRef.current) {
            clearTimeout(commandTimeoutRef.current);
            commandTimeoutRef.current = null;
          }
          if (payload.accepted) {
            setCommandStatus({
              pendingRequestId: null,
              lastVerdict: 'APPROVED',
              lastMessage: '명령 승인 수신 완료 (실제 개방은 후속 VEHICLE_STATE 수신 후 반영됩니다)',
              reasonCodes: [],
            });
            appendLog('COMMAND_RESULT', `명령 승인됨 (req: ${payload.requestId}) — 후속 차량 상태 대기`, payload);
            announce('트렁크 열기 명령이 승인되었습니다.');
          } else {
            const reasonsKo = (payload.reasonCodes || []).map((c) => REASON_LABELS_KO[c] || c);
            setCommandStatus({
              pendingRequestId: null,
              lastVerdict: 'BLOCKED',
              lastMessage: `명령 거부됨: ${reasonsKo.join(', ') || '안전 조건 미충족'}`,
              reasonCodes: payload.reasonCodes || [],
            });
            appendLog('COMMAND_RESULT', `명령 거부됨: ${reasonsKo.join(', ')}`, payload);
            announce(`트렁크 열기 차단: ${reasonsKo.join(', ')}`);
          }
        },
        [appendLog, announce]
      );

      const handleIncomingProtocolMessage = useCallback(
        (raw, transportLabel) => {
          const check = validateProtocolMessage(raw);
          if (!check.valid) {
            appendLog('VALIDATION_DROP', `[${transportLabel}] 유효하지 않은 메시지 거부: ${check.error}`);
            return;
          }
          if (raw.source === 'simulator') return;
          if (stateRef.current.mode === 'EXTERNAL_BRIDGE' &&
              (transportLabel !== 'WebSocket' || raw.source !== 'android-bridge')) return;
          if (stateRef.current.mode !== 'EXTERNAL_BRIDGE' && transportLabel === 'WebSocket') return;
          if (!checkAndRecordMessageId(raw.messageId)) return;

          const { type, payload, sessionId } = raw;

          if (type === 'ERROR') {
            appendLog('BRIDGE_ERROR', String(payload.code || 'UNKNOWN_ERROR'));
            announce('브리지 요청 거부: ' + String(payload.code || 'UNKNOWN_ERROR'));
          } else if (type === 'HELLO' || type === 'HEARTBEAT') {
            setConnectionState((prev) => ({
              ...prev,
              connected: true,
              sessionId: sessionId || prev.sessionId,
              lastHeartbeatAt: Date.now(),
              lastSequence: sessionId !== prev.sessionId ? -1 : prev.lastSequence,
            }));
            appendLog(type, `[${transportLabel}] ${raw.source} 세션(${sessionId}) 수신`);
          } else if (type === 'VEHICLE_STATE') {
            applyIncomingVehicleState(payload, sessionId);
            appendLog('VEHICLE_STATE', `[${transportLabel}] seq:${payload.sequence} gear:${payload.gear} trunk:${payload.doors.trunk}`);
          } else if (type === 'SCENARIO_STATE') {
            setScenarioState((prev) => ({
              ...prev,
              ...payload,
              carePrefs: payload.carePrefs ? { ...prev.carePrefs, ...payload.carePrefs } : prev.carePrefs,
            }));
            appendLog('SCENARIO_STATE', `[${transportLabel}] 시나리오 상태 동기화 수신`);
          } else if (type === 'COMMAND_RESULT') {
            applyIncomingCommandResult(payload);
          } else if (type === 'COMMAND_REQUEST') {
            // 외부 IVI 웹앱에서 시뮬레이터로 보낸 명령 요청 처리 (중복 requestId는 handleDoorCommandRequest에서 차단)
            handleDoorCommandRequest(payload.target, payload.action, `외부 IVI 앱 요청 (${transportLabel})`, payload.requestId);
          }
        },
        [appendLog, checkAndRecordMessageId, applyIncomingVehicleState, applyIncomingCommandResult]
      );

      // BroadcastChannel 및 window.postMessage 리스너 등록
      useEffect(() => {
        let bc = null;
        try {
          bc = new BroadcastChannel('vehicle-bridge');
          bcRef.current = bc;
          bc.onmessage = (e) => {
            handleIncomingProtocolMessage(e.data, 'BroadcastChannel');
          };
        } catch (err) {
          appendLog('BC_INIT', 'BroadcastChannel을 사용할 수 없는 환경입니다.');
        }

        const onWindowMessage = (e) => {
          const allowedOrigin = stateRef.current.allowedOriginInput;
          if (!allowedOrigin || e.origin !== allowedOrigin) return;
          if (!iframeRef.current || e.source !== iframeRef.current.contentWindow) return;
          handleIncomingProtocolMessage(e.data, 'postMessage');
        };

        window.addEventListener('message', onWindowMessage);
        return () => {
          window.removeEventListener('message', onWindowMessage);
          if (bc) bc.close();
        };
      }, [handleIncomingProtocolMessage, appendLog]);

      // WebSocket 수동 연결/해제 함수
      const connectWebSocket = useCallback(() => {
        if (stateRef.current.mode !== 'EXTERNAL_BRIDGE') return;
        if (wsRef.current) {
          wsRef.current.close();
          wsRef.current = null;
        }
        try {
          setWsStatusText(`연결 시도 중 (${wsUrlInput})...`);
          receivedStateRef.current = {sessionId:null,sequence:-1};
          const ws = new WebSocket(wsUrlInput);
          wsRef.current = ws;

          ws.onopen = () => {
            if (wsRef.current !== ws) return;
            const newSess = createId('sess-ws');
            setWsStatusText(`연결됨 (${wsUrlInput})`);
            // 연결 직후에는 상태를 UNKNOWN으로 두고 유효한 스냅샷 수신 후 제어 허용
            setConnectionState({
              connected: true,
              snapshotReceived: false,
              sessionId: newSess,
              lastHeartbeatAt: Date.now(),
              lastSequence: 0,
            });
            setVehicleState((prev) => ({
              ...prev,
              gear: 'UNKNOWN',
              doors: { driverDoor: 'UNKNOWN', passengerDoor: 'UNKNOWN', trunk: 'UNKNOWN' },
            }));
            sendProtocolEnvelope('HELLO', { client: 'pleos-curblink-3d-shell', requestSnapshot: true }, 'ws');
            appendLog('WS_OPEN', `WebSocket 브리지 연결됨 (${wsUrlInput}) — 초기 상태 UNKNOWN, 스냅샷 대기`);
          };

          ws.onmessage = (e) => {
            if (wsRef.current !== ws) return;
            try {
              const parsed = JSON.parse(e.data);
              handleIncomingProtocolMessage(parsed, 'WebSocket');
            } catch (err) {
              appendLog('WS_PARSE_ERR', 'WebSocket JSON 파싱 실패');
            }
          };

          ws.onerror = () => {
            setWsStatusText('연결되지 않음 (서버 응답 없음)');
          };

          ws.onclose = () => {
            if (wsRef.current !== ws) return;
            setWsStatusText('연결되지 않음 (연결 종료)');
            if (stateRef.current.mode === 'EXTERNAL_BRIDGE') {
              setConnectionState((prev) => ({
                ...prev,
                connected: false,
                snapshotReceived: false,
              }));
              setVehicleState((prev) => ({
                ...prev,
                gear: 'UNKNOWN',
                doors: { driverDoor: 'UNKNOWN', passengerDoor: 'UNKNOWN', trunk: 'UNKNOWN' },
              }));
              appendLog('WS_CLOSE', '외부 브리지 연결 해제됨 — 차량 상태 UNKNOWN 전환 및 제어 차단');
            }
          };
        } catch (err) {
          setWsStatusText(`연결 오류: ${err.message}`);
        }
      }, [wsUrlInput, sendProtocolEnvelope, handleIncomingProtocolMessage, appendLog]);

      // 언마운트 시 타이머/소켓 정리
      useEffect(() => {
        return () => {
          if (wsRef.current) wsRef.current.close();
          if (commandTimeoutRef.current) clearTimeout(commandTimeoutRef.current);
        };
      }, []);

      // ============================================================================
      // 12. 명령 요청 처리 (MockVehicleAdapter vs 외부 브리지 모드 분리)
      // ============================================================================
      const handleDoorCommandRequest = useCallback(
        (target, action, triggerSourceLabel = '사용자 요청', customRequestId = null) => {
          const reqId = customRequestId || createId('req');
          if (processedRequestIdsRef.current.has(reqId)) {
            appendLog('DUPLICATE_REQ', `동일 requestId(${reqId}) 중복 수신 — 차량 동작 반복 차단됨`);
            return;
          }
          processedRequestIdsRef.current.add(reqId);
          if (processedRequestIdsRef.current.size > MAX_SEEN_IDS) {
            const oldest = processedRequestIdsRef.current.values().next().value;
            processedRequestIdsRef.current.delete(oldest);
          }

          const {
            mode: currentMode,
            vehicleState: vs,
            scenarioState: ss,
            connectionState: cs,
            ttlConfig: ttl,
          } = stateRef.current;

          appendLog('COMMAND_REQUEST', `[${triggerSourceLabel}] ${target} -> ${action} (reqId: ${reqId})`);

          // B. 외부 브리지 모드: 로컬에서 즉시 열지 않고 COMMAND_REQUEST 송신 후 대기
          if (currentMode === 'EXTERNAL_BRIDGE') {
            appendLog('APK_AUTHORITY', '고객 승인과 정상 차량 명령은 실제 APK에서 조작하세요.');
            announce('실제 APK에서 조작하세요.');
            return;
          }

          // A. 독립 웹 데모 모드 (내장 MockVehicleAdapter가 안전 판단 및 상태 갱신 수행)
          const now = Date.now();
          if (target === 'trunk' && action === 'OPEN') {
            const evalResult = evaluateTrunkSafety({
              vehicleState: vs,
              scenarioState: ss,
              connectionState: cs,
              nowMs: now,
              explicitUserRequest: true,
              ttlConfig: ttl,
            });

            if (!evalResult.allowed) {
              setCommandStatus({
                pendingRequestId: null,
                lastVerdict: 'BLOCKED',
                lastMessage: `트렁크 열기 차단: ${evalResult.reasonsKo.join(' / ')}`,
                reasonCodes: evalResult.reasonCodes,
              });
              sendProtocolEnvelope('COMMAND_RESULT', {
                requestId: reqId,
                accepted: false,
                reasonCodes: evalResult.reasonCodes,
              });
              appendLog('SAFETY_BLOCKED', `트렁크 열기 거부됨: ${evalResult.reasonsKo.join(', ')}`, evalResult.reasonCodes);
              announce(`트렁크 열기 차단됨: ${evalResult.reasonsKo.join(', ')}`);
              return;
            }

            // 모든 13개 안전 조건 통과!
            setCommandStatus({
              pendingRequestId: null,
              lastVerdict: 'APPROVED',
              lastMessage: '13개 안전 인터록 검증 통과 — 트렁크 개방 승인 및 상태 전환 완료',
              reasonCodes: [],
            });

            sendProtocolEnvelope('COMMAND_RESULT', {
              requestId: reqId,
              accepted: true,
              reasonCodes: [],
            });

            setVehicleState((prev) => {
              const nextSeq = prev.sequence + 1;
              const nextDoors = { ...prev.doors, trunk: 'OPEN' };
              sendProtocolEnvelope('VEHICLE_STATE', {
                sequence: nextSeq,
                speedKph: prev.speedKph,
                gear: prev.gear,
                uxRestricted: prev.uxRestricted,
                doors: nextDoors,
                rearObstacle: prev.rearObstacle,
                vehicleDataValid: prev.vehicleDataValid,
                sensorDataValid: prev.sensorDataValid,
                oemControlAllowed: prev.oemControlAllowed,
              });
              return {
                ...prev,
                sequence: nextSeq,
                doors: nextDoors,
                lastVehicleRxAt: Date.now(),
              };
            });

            appendLog('TRUNK_OPENED', '안전 조건 재검증 통과 → 트렁크 OPEN 전환');
            announce('안전 조건이 확인되어 트렁크가 열렸습니다.');
            return;
          }

          // 트렁크 닫기 또는 일반 운전석/조수석 도어 개폐 (정차 및 연결 확인)
          if (!cs.connected || !cs.snapshotReceived || vs.gear !== 'P' || vs.speedKph > 0) {
            const blockCode = !cs.connected ? 'BRIDGE_DISCONNECTED' : vs.gear !== 'P' ? 'GEAR_NOT_P' : 'SPEED_NON_ZERO';
            setCommandStatus({
              pendingRequestId: null,
              lastVerdict: 'BLOCKED',
              lastMessage: `도어 조작 차단: ${REASON_LABELS_KO[blockCode]}`,
              reasonCodes: [blockCode],
            });
            appendLog('DOOR_BLOCKED', `${target} ${action} 차단됨 (${REASON_LABELS_KO[blockCode]})`);
            return;
          }

          setVehicleState((prev) => {
            const nextSeq = prev.sequence + 1;
            const nextDoors = { ...prev.doors, [target]: action === 'OPEN' ? 'OPEN' : 'CLOSED' };
            return {
              ...prev,
              sequence: nextSeq,
              doors: nextDoors,
              lastVehicleRxAt: Date.now(),
            };
          });
          appendLog('DOOR_CHANGED', `${target} 상태 ${action} 반영 완료`);
        },
        [appendLog, announce, sendProtocolEnvelope]
      );

      // ============================================================================
      // 13. 평가자 제어 독 상태 주입 인터페이스 (sendEvaluatorInjection)
      // ============================================================================
      const sendEvaluatorInjection = useCallback(
        (label, vehiclePatch = null, scenarioPatch = null) => {
          const { mode: currentMode } = stateRef.current;

          if (currentMode === 'EXTERNAL_BRIDGE') {
            if (scenarioPatch) { appendLog('APK_AUTHORITY', '주문·지원·고객 준비는 실제 APK에서 조작하세요.'); return; }
            // 외부 브리지 모드에서는 로컬 상태를 임의 확정하지 않고 상태 주입 요청으로 전달
            sendProtocolEnvelope('EVALUATOR_INJECT', {
              label,
              vehiclePatch,
              scenarioPatch,
            });
            appendLog('EVAL_INJECT_REQ', `[평가자 상태 주입 요청 전송] ${label} (외부 브리지 반영 대기)`);
            return;
          }

          // 웹 데모 모드에서는 Mock 상태에 즉시 주입하되 "평가자용 상태 주입"으로 명확히 기록
          const now = Date.now();
          if (vehiclePatch) {
            setVehicleState((prev) => {
              const nextDoors = vehiclePatch.doors ? { ...prev.doors, ...vehiclePatch.doors } : prev.doors;
              return {
                ...prev,
                ...vehiclePatch,
                doors: nextDoors,
                sequence: prev.sequence + 1,
                lastVehicleRxAt:
                  vehiclePatch.vehicleDataValid === false ? prev.lastVehicleRxAt - 5000 : now,
                lastSensorRxAt:
                  vehiclePatch.sensorDataValid === false ? prev.lastSensorRxAt - 5000 : now,
              };
            });
          }
          if (scenarioPatch) {
            setScenarioState((prev) => ({
              ...prev,
              ...scenarioPatch,
              carePrefs: scenarioPatch.carePrefs
                ? { ...prev.carePrefs, ...scenarioPatch.carePrefs }
                : prev.carePrefs,
            }));
          }
          appendLog('EVAL_INJECT', `[평가자용 상태 주입] ${label} (앱 정상 제어가 아님)`);
        },
        [appendLog, sendProtocolEnvelope]
      );

      // 물품 적재 완료 및 트렁크 닫기 헬퍼
      const completeLoadingAndCloseTrunk = useCallback(() => {
        if (stateRef.current.mode === 'EXTERNAL_BRIDGE') {
          handleDoorCommandRequest('trunk', 'CLOSE', '적재 완료 후 닫기 요청');
          return;
        }
        setVehicleState((prev) => ({
          ...prev,
          sequence: prev.sequence + 1,
          doors: { ...prev.doors, trunk: 'CLOSED' },
          lastVehicleRxAt: Date.now(),
        }));
        setScenarioState((prev) => ({
          ...prev,
          handoffCompleted: true,
        }));
        setCommandStatus({
          pendingRequestId: null,
          lastVerdict: 'APPROVED',
          lastMessage: '직원 적재 완료 및 트렁크 닫힘 확인 — 물품 수령이 최종 완료되었습니다.',
          reasonCodes: [],
        });
        appendLog('HANDOFF_COMPLETE', '트렁크 CLOSED 확인 및 고객 물품 수령 완료');
        announce('물품 적재 및 트렁크 닫힘이 확인되어 인계가 완료되었습니다.');
      }, [handleDoorCommandRequest, appendLog, announce]);

      // ============================================================================
      // 14. 발표용 자동 시나리오 재생 컨트롤러
      // ============================================================================
      useEffect(() => {
        if (mode === 'EXTERNAL_BRIDGE' || !autoPlayState.playing || autoPlayState.paused) return;

        const stepIndex = autoPlayState.currentStep;
        if (stepIndex >= PRESENTATION_STEPS.length) {
          setAutoPlayState((prev) => ({
            ...prev,
            playing: false,
            simulatedInputBanner: false,
          }));
          appendLog('SCENARIO_END', '발표용 6단계 자동 시나리오 재생 완료');
          return;
        }

        const stepDef = PRESENTATION_STEPS[stepIndex];
        setCameraMode(stepDef.camera);
        setAutoPlayState((prev) => ({
          ...prev,
          simulatedInputBanner: stepDef.simulatedUserInput,
          voiceDialog: stepDef.voiceDialog || [],
          narration: stepDef.narration,
        }));

        appendLog('SCENARIO_STEP', `${stepDef.title} 시작`);
        announce(stepDef.title);

        stepDef.apply({
          setVehicle: (updater) =>
            setVehicleState((prev) => {
              const next = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
              return {
                ...next,
                sequence: prev.sequence + 1,
                lastVehicleRxAt: Date.now(),
                lastSensorRxAt: Date.now(),
              };
            }),
          setScenario: (updater) =>
            setScenarioState((prev) => (typeof updater === 'function' ? updater(prev) : { ...prev, ...updater })),
          triggerOpenTrunkRequest: (label) => handleDoorCommandRequest('trunk', 'OPEN', label),
          completeLoadingAndCloseTrunk,
        });

        const timer = setTimeout(() => {
          setAutoPlayState((prev) => ({
            ...prev,
            currentStep: prev.currentStep + 1,
          }));
        }, stepDef.durationMs);

        return () => clearTimeout(timer);
      }, [
        autoPlayState.playing,
        autoPlayState.paused,
        autoPlayState.currentStep,
        appendLog,
        announce,
        handleDoorCommandRequest,
        completeLoadingAndCloseTrunk,
      ]);

      const startAutoScenario = () => {
        if (mode === 'EXTERNAL_BRIDGE') { announce('자동 시나리오는 독립 웹 데모 모드에서 실행하세요.'); return; }
        if (wsRef.current) { const old = wsRef.current; wsRef.current = null; old.close(); }
        setMode('WEB_DEMO');
        setFreezeSensorStream(false);
        setConnectionState((prev) => ({
          ...prev,
          connected: true,
          snapshotReceived: true,
        }));
        setAutoPlayState({
          playing: true,
          paused: false,
          currentStep: 0,
          simulatedInputBanner: false,
          voiceDialog: [],
          narration: '',
        });
      };

      const resetAll = () => {
        if (mode === 'EXTERNAL_BRIDGE') { announce('외부 모드는 실제 APK에서 초기화하세요.'); return; }
        const now = Date.now();
        setFreezeSensorStream(false);
        setAutoPlayState({
          playing: false,
          paused: false,
          currentStep: 0,
          simulatedInputBanner: false,
          voiceDialog: [],
          narration: '',
        });
        setConnectionState({
          connected: true,
          snapshotReceived: true,
          sessionId: createId('sess'),
          lastHeartbeatAt: now,
          lastSequence: 1,
        });
        setVehicleState({
          sequence: 1,
          speedKph: 0,
          gear: 'P',
          uxRestricted: false,
          doors: { driverDoor: 'CLOSED', passengerDoor: 'CLOSED', trunk: 'CLOSED' },
          rearObstacle: false,
          vehicleDataValid: true,
          sensorDataValid: true,
          oemControlAllowed: true,
          lastVehicleRxAt: now,
          lastSensorRxAt: now,
        });
        setScenarioState({
          orderId: 'ORD-2026-A3',
          orderItemsSummary: '친환경 우유 외 4건 (28,500원)',
          orderReady: true,
          pickupZoneConfirmed: true,
          otpVerified: true,
          carePrefs: { waitInVehicle: false, loadingHelp: false, extraPrepTime: false },
          merchantResponse: 'PENDING',
          customerReadyConfirmed: false,
          invalidationNotice: '',
          handoffCompleted: false,
        });
        setCommandStatus({
          pendingRequestId: null,
          lastVerdict: null,
          lastMessage: '초기화 완료 — 모든 상태가 기본 정차(P단) 상태로 복원되었습니다.',
          reasonCodes: [],
        });
        appendLog('RESET', '시뮬레이터 전체 상태 초기화 완료');
      };

      // 현재 시점 실시간 안전 평가 결과
      const safetyEval = useMemo(
        () =>
          evaluateTrunkSafety({
            vehicleState,
            scenarioState,
            connectionState,
            nowMs,
            explicitUserRequest: true,
            ttlConfig,
          }),
        [vehicleState, scenarioState, connectionState, nowMs, ttlConfig]
      );

      // 주행 중 터치 잠금 여부 (차속 > 0 또는 기어 !== P 또는 UX 제한 활성화)
      const isTouchLockedByDriving =
        !connectionState.connected ||
        !connectionState.snapshotReceived ||
        vehicleState.speedKph > 0 ||
        vehicleState.gear !== 'P' ||
        vehicleState.uxRestricted;

      const careActive = isCareRequested(scenarioState.carePrefs);

      // 고객 배려 픽업 옵션 토글 핸들러 (변경 시 고객 준비 확인 무효화 및 매장 응답 PENDING 전환)
      const toggleCarePref = (key) => {
        if (mode === 'EXTERNAL_BRIDGE' || isTouchLockedByDriving) return;
        setScenarioState((prev) => {
          const nextPrefs = { ...prev.carePrefs, [key]: !prev.carePrefs[key] };
          const anySelected = isCareRequested(nextPrefs);
          return {
            ...prev,
            carePrefs: nextPrefs,
            merchantResponse: anySelected ? 'PENDING' : 'PENDING',
            customerReadyConfirmed: false,
            invalidationNotice: prev.customerReadyConfirmed
              ? '배려 픽업 요청 항목이 변경되어 고객 준비 확인이 초기화되었습니다. 매장 수락 후 다시 확인해주세요.'
              : prev.invalidationNotice,
          };
        });
        appendLog('CARE_PREF_CHANGE', `배려 픽업 옵션 변경 (${key}) — 준비 확인 초기화`);
      };

      // DestinationDemo is the sole vehicle input owner while a preset is running.
      const applyDestinationFrame = useCallback(frame => {
        if (stateRef.current.mode !== 'WEB_DEMO') return;
        setNavigationFrame(frame);
        setVehicleState(prev => ({ ...prev, speedKph: frame.speedKph,
          gear: frame.gear || (frame.stopped ? 'P' : 'D'), uxRestricted: !frame.stopped, hazards: Boolean(frame.hazards) }));
        setScenarioState(prev => ({ ...prev, pickupZoneConfirmed:
          frame.stopped && !['MEAL_SETUP','ACCESS_SETUP','ACCESS_RESELECT'].includes(frame.phase) && frame.mode !== CurbLane.DestinationMode.PARKING }));
      }, []);
      const beginDestinationDemo = useCallback(() => {
        setAutoPlayState(prev => ({ ...prev, playing: false, narration: '', simulatedInputBanner: false }));
        setScenarioState(prev => ({ ...prev, handoffCompleted: false,
          customerReadyConfirmed: false, pickupZoneConfirmed: false }));
      }, []);

      const runLaneScenario = useCallback((step, action) => {
        if (mode !== 'WEB_DEMO' || commandStatus.pendingRequestId || vehicleState.doors.trunk !== 'CLOSED') return;
        setAutoPlayState(prev => ({ ...prev, playing: false, narration: '', simulatedInputBanner: false }));
        const parked = action === 'PARK';
        setCameraMode(parked ? 'TRUNK_HANDOFF' : 'EXTERIOR');
        sendEvaluatorInjection('차선 시연: ' + step + (action || ''), {
          speedKph: parked ? 0 : 30, gear: parked ? 'P' : 'D', uxRestricted: !parked
        }, { pickupZoneConfirmed: parked, ...(!action ? { handoffCompleted: false } : {}) });
      }, [mode, commandStatus.pendingRequestId, vehicleState.doors.trunk, sendEvaluatorInjection]);

      return (
        <div className={`${presentationMode ? 'presentation-mode' : ''} min-h-screen w-full bg-[#060911] text-slate-100 flex flex-col justify-between p-2 sm:p-3 select-none`}>
          {/* 스크린 리더 전용 실시간 상태 알림 영역 */}
          <div className="sr-only" role="status" aria-live="polite" aria-atomic="true">
            {ariaAnnouncement}
          </div>

          {/* 상단 고정 배너: 시뮬레이션 고지 및 모드 전환 */}
          <header className="w-full max-w-[1840px] mx-auto mb-3 p-4 flex flex-wrap justify-between items-center gap-3 rounded-xl border border-slate-700 bg-slate-900">
            <div><h1 className="font-bold text-xl">CurbLink Drive · 목적지, 그 다음까지</h1><p className="text-xs text-slate-400 mt-1">공모전 프로토타입 · 주행/주문/카메라/차량 연동은 모의</p></div>
            <a className="px-4 py-3 rounded-lg bg-teal-800 text-teal-100" href="../release/CurbLink-Drive-0.2-demo.apk" download>Android APK 다운로드</a>
          </header>

          {/* 자동 시나리오 재생 배너 (고객 입력 자동 재생 고지 포함) */}
          {(autoPlayState.playing || autoPlayState.narration) && (
            <div className="w-full max-w-[1840px] mx-auto mb-2 px-4 py-2 rounded-xl bg-indigo-950/90 border border-indigo-500/60 flex flex-wrap items-center justify-between gap-2 text-xs">
              <div className="flex flex-wrap items-center gap-2">
                <span className="px-2 py-0.5 rounded bg-indigo-600 text-white font-bold">
                  {PRESENTATION_STEPS[autoPlayState.currentStep]?.title || '시나리오 완료'}
                </span>
                <span className="text-slate-200 font-medium">{autoPlayState.narration}</span>
              </div>
              {autoPlayState.simulatedInputBanner && (
                <span className="px-2.5 py-1 rounded bg-amber-500/20 border border-amber-400 text-amber-200 font-bold">
                  [고지] 시연 스크립트가 사용자 입력을 재생 중 (실제 서비스는 고객 직접 확인 필수)
                </span>
              )}
            </div>
          )}

          {presentationMode && <DestinationDemo
            enabled={mode === 'WEB_DEMO' && !commandStatus.pendingRequestId && !autoPlayState.playing}
            safe={connectionState.connected && connectionState.snapshotReceived && vehicleState.vehicleDataValid && vehicleState.sensorDataValid && vehicleState.oemControlAllowed && !vehicleState.rearObstacle &&
              nowMs - vehicleState.lastVehicleRxAt < ttlConfig.vehicleTtlMs && nowMs - vehicleState.lastSensorRxAt < ttlConfig.sensorTtlMs &&
              Object.values(vehicleState.doors).every(value => value === 'CLOSED')}
            onFrame={applyDestinationFrame} onStart={beginDestinationDemo} onActive={setDestinationActive} />}



        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
